name: Verify release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-browser-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_DATABASE: dsalab
          MYSQL_USER: dsalab
          MYSQL_PASSWORD: ci-disposable-password
          MYSQL_ROOT_PASSWORD: ci-disposable-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=3s --health-timeout=3s --health-retries=40
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/dsalab
      DB_USER: dsalab
      DB_PASSWORD: ci-disposable-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Native correctness, sanitizers and replay fixtures
        run: |
          scripts/test-native.sh
          python3 scripts/generate-engine-fixtures.py
      - name: Compile actual browser WebAssembly
        run: scripts/build-wasm.sh
      - name: Frontend checks
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run format:check
          npm --prefix frontend test
          npm --prefix frontend run build
          cd frontend && npx playwright install --with-deps chromium
      - name: Backend and actual MySQL transaction/security tests
        working-directory: backend
        run: ./mvnw -B verify
      - name: Start application backend
        run: |
          java -jar backend/target/learning-lab-1.0.0.jar > .build/backend-runtime.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8080/api/modules > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/api/modules > /dev/null
      - name: Actual Wasm, guest and authenticated browser acceptance
        run: INTEGRATED=1 npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: verification-diagnostics
          path: |
            .build/backend-runtime.log
            frontend/test-results
            backend/target/surefire-reports
          retention-days: 7
  container-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DB_PASSWORD: ci-container-password
      MYSQL_ROOT_PASSWORD: ci-container-root-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Reproduce full container build and startup
        run: |
          docker compose up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8088/api/modules > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8088/api/modules > /dev/null
      - name: Production bundle browser acceptance
        run: |
          npm --prefix frontend ci
          cd frontend && npx playwright install --with-deps chromium && cd ..
          BASE_URL=http://127.0.0.1:8088 INTEGRATED=1 npm --prefix frontend run test:e2e -- e2e/learning.spec.ts e2e/slice.spec.ts e2e/authenticated.spec.ts
      - name: Container diagnostics
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
